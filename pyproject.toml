[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lobotoml"
version = "0.1.0"
description = "Tiny neural-network inference system compiled into Brainfuck: ML with zero frontal lobe capacity"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Adith", email = "adith@example.com"}
]
keywords = ["neural-network", "brainfuck", "compiler", "deep-learning", "esoteric", "fixed-point", "quantization", "lobotoml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
lobotoml = "lobotoml.cli:main"
neurofuck = "lobotoml.cli:main"

[tool.setuptools.packages.find]
include = ["lobotoml*"]
